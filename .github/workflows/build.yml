name: Build Plugin Jar

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Allows you to run this manually anytime

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/鏡/setup-java@v4 # Note: use 'actions/setup-java@v4' if manually typing
      uses: actions/setup-java@v4
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Compile and Package with Maven
      run: mvn clean package

    - name: Upload Finished Jar Asset
      uses: actions/upload-artifact@v4
      with:
        name: SignOp-Plugin-Jar
        path: target/signop-1.0.jar
